name: "Geyser"
run-name: "SAGE"
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  Viola:
    concurrency:
      group: "Folio-${{ github.ref_name }}"
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    environment:
      name: "github-pages"
      url: ${{ steps.arbor.outputs.page_url }}
    steps:
      - name: "lilac"
        uses: actions/checkout@v5
      - name: "harvest"
        uses: actions/configure-pages@v5
      - name: "YARROW"
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: "Cinder"
        id: arbor
        uses: actions/deploy-pages@v4
